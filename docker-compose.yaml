version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

    # IMPORTANT: override entrypoint so we can run bash script (otherwise it becomes `airflow bash ...`)
    entrypoint: ["/bin/bash", "-lc"]

    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      # Airflow 3.x: UI/API uses [api]
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"
      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"

      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

      # Admin user vars (keep these in Coolify secrets ideally)
      AIRFLOW_ADMIN_USERNAME: "admintractrac"
      AIRFLOW_ADMIN_PASSWORD: "@Tractrac_2025"
      AIRFLOW_ADMIN_FIRSTNAME: "Tractrac"
      AIRFLOW_ADMIN_LASTNAME: "ISSAM"
      AIRFLOW_ADMIN_EMAIL: "tractracnigeria@gmail.com"

    volumes:
      - airflow-logs:/opt/airflow/logs

    command: |
      set -e
      airflow db migrate

      # create user only if it doesn't exist
      airflow users list | grep -q "$AIRFLOW_ADMIN_USERNAME" || \
      airflow users create \
        --username "$AIRFLOW_ADMIN_USERNAME" \
        --password "$AIRFLOW_ADMIN_PASSWORD" \
        --firstname "$AIRFLOW_ADMIN_FIRSTNAME" \
        --lastname "$AIRFLOW_ADMIN_LASTNAME" \
        --role Admin \
        --email "$AIRFLOW_ADMIN_EMAIL"

  airflow-api:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"
      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"

    # IMPORTANT: use the Airflow subcommand ONLY (entrypoint already runs `airflow <command>`)
    command: ["api-server"]

  airflow-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["scheduler"]

  airflow-dag-processor:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["dag-processor"]

  airflow-triggerer:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["triggerer"]

volumes:
  postgres-data:
  airflow-logs: