version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

    # IMPORTANT: run bash directly (prevents `airflow bash ...` issues)
    entrypoint: ["/bin/bash", "-lc"]

    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      # FAB auth manager
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

      # Postgres metadata DB
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      # Airflow 3 UI/API
      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"

      # IMPORTANT: set a stable secret key (set this in Coolify too)
      AIRFLOW__API__SECRET_KEY: "CHANGE_ME_IN_COOLIFY"

      # Your existing fernet key (prefer putting this in Coolify too)
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

      # Admin user values should be set in Coolify env vars:
      # AIRFLOW_ADMIN_USERNAME
      # AIRFLOW_ADMIN_PASSWORD
      # AIRFLOW_ADMIN_FIRSTNAME
      # AIRFLOW_ADMIN_LASTNAME
      # AIRFLOW_ADMIN_EMAIL

    volumes:
      - airflow-logs:/opt/airflow/logs

    # Always exit 0 so Coolify doesn't mark deployment failed due to init
    command: >
      set -e;
      echo "[init] migrating DB";
      airflow db migrate || true;
      echo "[init] creating admin user if vars provided";
      if [ -n "$AIRFLOW_ADMIN_USERNAME" ] && [ -n "$AIRFLOW_ADMIN_PASSWORD" ] && [ -n "$AIRFLOW_ADMIN_EMAIL" ]; then
        airflow users list | grep -q " $AIRFLOW_ADMIN_USERNAME " ||
        airflow users create
        --username "$AIRFLOW_ADMIN_USERNAME"
        --password "$AIRFLOW_ADMIN_PASSWORD"
        --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}"
        --lastname "${AIRFLOW_ADMIN_LASTNAME:-User}"
        --role Admin
        --email "$AIRFLOW_ADMIN_EMAIL"
        || true;
      else
        echo "[init] admin env vars not set, skipping user creation";
      fi;
      echo "[init] done";
      exit 0

  airflow-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"
      AIRFLOW__API__SECRET_KEY: "CHANGE_ME_IN_COOLIFY"

      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs

    # DO NOT publish 8080 on the host (Coolify proxy should route internally)
    expose:
      - "8080"

    command: ["api-server"]

  airflow-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__API__SECRET_KEY: "CHANGE_ME_IN_COOLIFY"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["scheduler"]

  airflow-dag-processor:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__API__SECRET_KEY: "CHANGE_ME_IN_COOLIFY"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["dag-processor"]

  airflow-triggerer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__API__SECRET_KEY: "CHANGE_ME_IN_COOLIFY"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["triggerer"]

volumes:
  postgres-data:
  airflow-logs:
