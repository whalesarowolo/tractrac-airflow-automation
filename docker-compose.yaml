version: "3.8"

services:
  airflow:
    build: .
    container_name: airflow-tractrac
    restart: unless-stopped
    # Let the image run as its default 'airflow' user
    # user: "0:0"   # ← remove this unless you really need root

    environment:
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
      AIRFLOW__CORE__PLUGINS_FOLDER: "/opt/airflow/plugins"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/airflow.db"

      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__WEBSERVER__BASE_URL: "https://airflow.tractrac.co"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"

      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

      _AIRFLOW_WWW_USER_USERNAME: "admintractrac"
      _AIRFLOW_WWW_USER_PASSWORD: "@Tractrac_2025"
      _AIRFLOW_WWW_USER_FIRSTNAME: "Tractrac"
      _AIRFLOW_WWW_USER_LASTNAME: "ISSAM"
      _AIRFLOW_WWW_USER_EMAIL: "tractracnigeria@gmail.com"

    volumes:
      - airflow-data:/opt/airflow

    command: standalone

volumes:
  airflow-data:
