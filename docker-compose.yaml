version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

    # IMPORTANT: override entrypoint so it doesn't become `airflow bash ...`
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - >
        set -e;
        airflow db migrate;
        airflow users list | grep -q " $AIRFLOW_ADMIN_USERNAME " ||
        airflow users create
          --username "$AIRFLOW_ADMIN_USERNAME"
          --password "$AIRFLOW_ADMIN_PASSWORD"
          --firstname "$AIRFLOW_ADMIN_FIRSTNAME"
          --lastname "$AIRFLOW_ADMIN_LASTNAME"
          --role Admin
          --email "$AIRFLOW_ADMIN_EMAIL";
        echo "airflow-init done";

    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      # FAB auth manager (this will now take effect because we are NOT using standalone)
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

      # Postgres metadata DB
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      # Airflow 3: UI/API runs on the API server
      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"

      # Keep your existing fernet key (prefer Coolify secret)
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

      # Admin user for first-time setup (prefer Coolify secrets)
      AIRFLOW_ADMIN_USERNAME: "admintractrac"
      AIRFLOW_ADMIN_PASSWORD: "@Tractrac_2025"
      AIRFLOW_ADMIN_FIRSTNAME: "Tractrac"
      AIRFLOW_ADMIN_LASTNAME: "ISSAM"
      AIRFLOW_ADMIN_EMAIL: "tractracnigeria@gmail.com"

    volumes:
      - airflow-logs:/opt/airflow/logs

  airflow-api:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"

      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__API__BASE_URL: "https://airflow.tractrac.co"

      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs

    # Keep this if you want direct host access; Coolify may not require it.
    ports:
      - "8080:8080"

    # IMPORTANT: for apache/airflow image, command should be the airflow subcommand only
    command: ["api-server"]

  airflow-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["scheduler"]

  airflow-dag-processor:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["dag-processor"]

  airflow-triggerer:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__CORE__FERNET_KEY: "nwyqKoQOWOCPb7Ih5VsuJYd1YOQ9dlHQCiga-PgfPuk="
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["triggerer"]

volumes:
  postgres-data:
  airflow-logs:
